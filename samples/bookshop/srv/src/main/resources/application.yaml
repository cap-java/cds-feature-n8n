
---
spring:
  config:
    activate:
      on-profile: default
  sql:
    init:
      platform: h2
cds:
  security:
    mock:
      users:
        admin:
          password: admin
          roles:
          - admin
        user:
          password: user
  data-source:
    auto-config:
      enabled: false
---
cds:
  outbox:
    services:
      N8nOutbox:
        maxAttempts: 10
        ordered: true
n8n:
  # n8n host only — no /webhook suffix. The plugin appends /webhook or /webhook-test automatically.
  base-url: ${N8N_BASE_URL:http://localhost:5678}
  # Optional webhook authentication — configure to match your n8n Webhook node auth settings.
  # Supported types: basic (username+password), header (custom header), bearer (token).
  # webhook-auth:
  #   type: header
  #   name: ${N8N_WEBHOOK_AUTH_NAME}
  #   value: ${N8N_WEBHOOK_AUTH_VALUE}
  # use-test-webhook: true switches to /webhook-test — requires clicking "Listen for Test Event"
  # in the n8n UI first; fires only once. Use for single-trigger manual testing only.
  use-test-webhook: false
  # n8n REST API key — used for future /api/v1/… calls, not for webhook authentication.
  # For webhook auth, use n8n.webhook-auth below.
  api-key: ${N8N_API_KEY:}
  # Optional webhook authentication — configure to match your n8n Webhook node auth settings.
  # Supported types: basic (username+password), header (custom header), bearer (token).
  # webhook-auth:
  #   type: header
  #   name: ${N8N_WEBHOOK_AUTH_NAME}
  #   value: ${N8N_WEBHOOK_AUTH_VALUE}
  # Also possible: use a BTP destination instead of base-url.
  # The destination's URL field provides the n8n host; its auth headers (e.g. Authorization: Bearer)
  # are forwarded to webhook nodes. n8n.webhook-auth is merged on top.
  # Requires cloudplatform-connectivity on the classpath and a default-env.json (local dev) or
  # a bound destination service instance (CF/BTP).
  #destination: my-n8n-dest
---
management:
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    db:
      enabled: true
