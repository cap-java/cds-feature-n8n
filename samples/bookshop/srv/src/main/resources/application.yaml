
---
spring:
  config:
    activate:
      on-profile: default
  sql:
    init:
      platform: h2
cds:
  security:
    mock:
      users:
        admin:
          password: admin
          roles:
          - admin
        user:
          password: user
  data-source:
    auto-config:
      enabled: false
n8n:
  webhooks:
    orderCreated:
      url: http://localhost:5678/webhook-test/order-created
      apiKey: ${N8N_API_KEY:}
    bookCreated:
      url: http://localhost:5678/webhook-test/book-created
      apiKey: ${N8N_API_KEY:}
    bookDeleted:
      url: http://localhost:5678/webhook-test/book-deleted
      apiKey: ${N8N_API_KEY:}
---
management:
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    db:
      enabled: true
